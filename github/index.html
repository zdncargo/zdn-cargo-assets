    <script>
      // Suppress Vite HMR WebSocket connection errors in AI Studio iframe environment
      window.addEventListener('unhandledrejection', function (event) {
        var str = event && event.reason ? String(event.reason.message || event.reason) : '';
        if (str.indexOf('WebSocket') !== -1 || str.indexOf('[vite]') !== -1) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
      window.addEventListener('error', function (event) {
        var str = event && event.message ? String(event.message) : '';
        if (str.indexOf('WebSocket') !== -1 || str.indexOf('[vite]') !== -1) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
